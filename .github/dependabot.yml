version: 2
updates:
  # Actions are SHA-pinned; Dependabot bumps the SHA and its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
  # The Blink Debit SDK is a runtime dependency that ships inside the plugin
  # zip, so an SDK release is a release of code that runs on merchants' sites.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
