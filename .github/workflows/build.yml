name: Build

on:
  push:
    branches: [ master ]
    tags: [ '[0-9]+.[0-9]+.[0-9]+' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v5
      - name: Use PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 — pinned by SHA: a moving tag could be repointed at malicious code
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Lint PHP files
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest and newest supported PHP; lint covers the versions between.
        php-version: [ '7.4', '8.4' ]
    steps:
      - uses: actions/checkout@v5
      - name: Use PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 — pinned by SHA: a moving tag could be repointed at malicious code
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Run unit tests
        run: vendor/bin/phpunit --coverage-clover coverage.xml
      # Sonar does not run tests; it reads the coverage report generated here,
      # measured once on the newest PHP.
      - name: Upload coverage report
        if: matrix.php-version == '8.4'
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.xml

  plugin-check:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Checked as it ships: running against the repository root would raise
      # findings about development files the zip never contains.
      - name: Build plugin directory
        run: .github/build-plugin.sh
      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: build/blinkpay-nz-for-woocommerce

  snyk:
    # Snyk runs on master pushes only; pull requests are covered by Sonar
    # and Plugin Check.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The plugin's Composer dependencies are dev-only, so Snyk Open Source
      # has nothing shipped to scan; Snyk Code (static analysis) is what
      # applies here.
      - name: Run Snyk Code to check for vulnerabilities
        uses: snyk/actions/php@master
        with:
          command: code test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG: blinkpay-zw9
          SNYK_PROJECT_NAME: blinkpay-nz-for-woocommerce
        continue-on-error: true

  sonar:
    if: github.event_name == 'pull_request' || ( github.event_name == 'push' && github.ref == 'refs/heads/master' )
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Sonar needs full history to attribute issues and measure new code.
          fetch-depth: 0
      - name: Download coverage report
        uses: actions/download-artifact@v5
        with:
          name: coverage
      - name: Run Sonar
        uses: sonarsource/sonarqube-scan-action@v5
        with:
          args: >
            -Dsonar.projectKey=blinkpay-nz-for-woocommerce
            -Dsonar.organization=blinkpay
            -Dsonar.sources=.
            -Dsonar.exclusions=assets/images/**,.github/**,tests/**,coverage.xml
            -Dsonar.tests=tests
            -Dsonar.php.coverage.reportPaths=coverage.xml
            -Dsonar.coverage.exclusions=uninstall.php
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        continue-on-error: true

  package:
    needs: [ lint, test ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build plugin zip
        run: |
          .github/build-plugin.sh
          cd build && zip -r blinkpay-nz-for-woocommerce.zip blinkpay-nz-for-woocommerce
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: blinkpay-nz-for-woocommerce
          path: build/blinkpay-nz-for-woocommerce.zip

  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: blinkpay-nz-for-woocommerce
      - name: Attach zip to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: blinkpay-nz-for-woocommerce.zip
