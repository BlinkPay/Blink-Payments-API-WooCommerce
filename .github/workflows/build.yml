name: Build

on:
  push:
    branches: [ master ]
    tags: [ '[0-9]+.[0-9]+.[0-9]+' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v5
      - name: Use PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Lint PHP files
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest and newest supported PHP; lint covers the versions between.
        php-version: [ '7.4', '8.4' ]
    steps:
      - uses: actions/checkout@v5
      - name: Use PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Run unit tests
        run: vendor/bin/phpunit

  snyk:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The plugin's Composer dependencies are dev-only, so Snyk Open Source
      # has nothing shipped to scan; Snyk Code (static analysis) is what
      # applies here.
      - name: Run Snyk Code to check for vulnerabilities
        uses: snyk/actions/php@master
        with:
          command: code test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG: blinkpay-zw9
          SNYK_PROJECT_NAME: blinkpay-nz-for-woocommerce
        continue-on-error: true

  sonar:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Sonar needs full history to attribute issues and measure new code.
          fetch-depth: 0
      - name: Run Sonar
        uses: sonarsource/sonarqube-scan-action@v5
        with:
          args: >
            -Dsonar.projectKey=blinkpay-nz-for-woocommerce
            -Dsonar.organization=blinkpay
            -Dsonar.sources=.
            -Dsonar.exclusions=assets/images/**,.github/**
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        continue-on-error: true

  package:
    needs: [ lint, test ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The zip unpacks to blinkpay-nz-for-woocommerce/, the plugin's canonical
      # directory name, regardless of the repository name.
      - name: Build plugin zip
        run: |
          mkdir -p build/blinkpay-nz-for-woocommerce
          rsync -a --exclude='.git' --exclude='.claude' --exclude='.github' --exclude='.gitignore' --exclude='.wp-env.json' --exclude='build' --exclude='composer.json' --exclude='composer.lock' --exclude='phpunit.xml.dist' --exclude='tests' --exclude='vendor' ./ build/blinkpay-nz-for-woocommerce/
          cd build && zip -r blinkpay-nz-for-woocommerce.zip blinkpay-nz-for-woocommerce
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: blinkpay-nz-for-woocommerce
          path: build/blinkpay-nz-for-woocommerce.zip

  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: blinkpay-nz-for-woocommerce
      - name: Attach zip to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: blinkpay-nz-for-woocommerce.zip
