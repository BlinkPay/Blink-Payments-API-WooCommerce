name: Build

on:
  push:
    branches: [ master ]
    tags: [ '[0-9]+.[0-9]+.[0-9]+' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — pinned by SHA: a moving tag could be repointed at malicious code
        with:
          persist-credentials: false
      - name: Use PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0 — pinned by SHA: a moving tag could be repointed at malicious code
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      # vendor is excluded deliberately: the Blink Debit SDK ships framework
      # test fixtures that target PHP 8.2+, and this job lints the code this
      # repository owns, across every PHP version the plugin supports.
      - name: Lint PHP files
        run: find . -name '*.php' -not -path './.git/*' -not -path './vendor/*' -not -path './build/*' -print0 | xargs -0 -n1 php -l

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest and newest supported PHP; lint covers the versions between.
        php-version: [ '7.4', '8.4' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — pinned by SHA: a moving tag could be repointed at malicious code
        with:
          persist-credentials: false
      - name: Use PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0 — pinned by SHA: a moving tag could be repointed at malicious code
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Run unit tests
        # Clover for Sonar, Cobertura for Aikido, which reads LCOV or Cobertura only.
        run: vendor/bin/phpunit --coverage-clover coverage.xml --coverage-cobertura cobertura.xml
      # Sonar and Aikido do not run tests; they read the coverage reports
      # generated here, measured once on the newest PHP.
      - name: Upload coverage reports
        if: matrix.php-version == '8.4'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 — pinned by SHA: a moving tag could be repointed at malicious code
        with:
          name: coverage
          path: |
            coverage.xml
            cobertura.xml

  plugin-check:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — pinned by SHA: a moving tag could be repointed at malicious code
        with:
          persist-credentials: false
      # Checked as it ships: running against the repository root would raise
      # findings about development files the zip never contains.
      - name: Build plugin directory
        run: .github/build-plugin.sh
      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9 — pinned by SHA: a moving tag could be repointed at malicious code
        with:
          build-dir: build/blinkpay-nz-for-woocommerce

  sonar:
    if: github.event_name == 'pull_request' || ( github.event_name == 'push' && github.ref == 'refs/heads/master' )
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — pinned by SHA: a moving tag could be repointed at malicious code
        with:
          persist-credentials: false
          # Sonar needs full history to attribute issues and measure new code.
          fetch-depth: 0
      - name: Download coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 — pinned by SHA: a moving tag could be repointed at malicious code
        with:
          name: coverage
      - name: Run Sonar
        uses: sonarsource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0 — pinned by SHA: a moving tag could be repointed at malicious code
        with:
          args: >
            -Dsonar.projectKey=blinkpay-nz-for-woocommerce
            -Dsonar.organization=blinkpay
            -Dsonar.sources=.
            -Dsonar.exclusions=assets/images/**,.github/**,tests/**,coverage.xml,cobertura.xml
            -Dsonar.tests=tests
            -Dsonar.php.coverage.reportPaths=coverage.xml
            -Dsonar.coverage.exclusions=uninstall.php
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        continue-on-error: true

  # Aikido's PR check waits 30 minutes for a report tied to the PR head commit,
  # which the action reads from the event payload. Kept as its own job so the
  # OIDC token grant stays off the test jobs, as Aikido recommends. Fork PRs
  # cannot mint an OIDC token, so they are skipped.
  aikido-coverage:
    if: ${{ !github.event.pull_request.head.repo.fork }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — pinned by SHA: a moving tag could be repointed at malicious code
        with:
          persist-credentials: false
      - name: Download coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 — pinned by SHA: a moving tag could be repointed at malicious code
        with:
          name: coverage
      - name: Upload coverage to Aikido
        uses: AikidoSec/code-coverage-github-action@e0637ab96a560c1ab11671c41a4a4668075bae0e # v2.1.1 — pinned by SHA: a moving tag could be repointed at malicious code
        with:
          region: au
          # The action tells the format from the filename, so keep "cobertura" in it.
          file-paths: cobertura.xml

  package:
    needs: [ lint, test ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — pinned by SHA: a moving tag could be repointed at malicious code
        with:
          persist-credentials: false
      - name: Build plugin zip
        run: |
          .github/build-plugin.sh
          cd build && zip -r blinkpay-nz-for-woocommerce.zip blinkpay-nz-for-woocommerce
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 — pinned by SHA: a moving tag could be repointed at malicious code
        with:
          name: blinkpay-nz-for-woocommerce
          path: build/blinkpay-nz-for-woocommerce.zip

  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 — pinned by SHA: a moving tag could be repointed at malicious code
        with:
          name: blinkpay-nz-for-woocommerce
      - name: Attach zip to the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3 — pinned by SHA: a moving tag could be repointed at malicious code
        with:
          files: blinkpay-nz-for-woocommerce.zip

  wordpress-org:
    # Publishes the tagged release to the WordPress.org plugin directory. SVN
    # there is a release repository — every commit rebuilds every version's
    # zip — so this runs once per tag and never from master.
    if: github.ref_type == 'tag'
    needs: [ package, plugin-check ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — pinned by SHA: a moving tag could be repointed at malicious code
        with:
          persist-credentials: false
      # WordPress.org serves whatever Stable tag names, so a header that does
      # not match the git tag ships the wrong build to every site.
      - name: Check the version headers match the tag
        run: |
          for header in "Version: $GITHUB_REF_NAME" "WC_BLINKPAY_VERSION', '$GITHUB_REF_NAME'"; do
            grep -qF -- "$header" blinkpay-nz-for-woocommerce.php || { echo "::error::blinkpay-nz-for-woocommerce.php does not contain \"$header\""; exit 1; }
          done
          grep -qxF -- "Stable tag: $GITHUB_REF_NAME" readme.txt || { echo "::error::readme.txt Stable tag is not $GITHUB_REF_NAME"; exit 1; }
      - name: Build plugin directory
        run: .github/build-plugin.sh
      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0 — pinned by SHA: a moving tag could be repointed at malicious code
        env:
          # The action derives the slug from the repository name, which differs
          # from the plugin's directory slug.
          SLUG: blinkpay-nz-for-woocommerce
          BUILD_DIR: build/blinkpay-nz-for-woocommerce
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
